[project]
name = "etcd-ocp-diag"
version = "1.0.0"
description = "Easy tool to review OpenShift etcd performance"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "etcd-ocp-diag contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
etcd-ocp-diag = "etcd-ocp-diag:main"

[project.urls]
"Homepage" = "https://github.com/your-org/etcd-ocp-diag"
"Bug Reports" = "https://github.com/your-org/etcd-ocp-diag/issues"
"Source" = "https://github.com/your-org/etcd-ocp-diag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
lint.extend-select = [
    "ARG",  # Flake8-unused-arguments - flags unused function arguments
    "F",    # Pyflakes
    "FURB", # Refurb
    "I",    # isort - import ordering checks
    "PL",   # Pylint
    "PTH",  # Flake8-use-pathlib - encourages pathlib over os.path
    "RUF",  # Ruff-specific rules - additional Ruff checks
]

lint.ignore = [
    "E501",  # Pycodestyle - line too long
    "PLR0912", # Pylint - Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
]